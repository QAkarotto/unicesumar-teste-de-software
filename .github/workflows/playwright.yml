
name: Testes Playwright API

on:
  push:
    branches:
      - feature/playwright-api-luiz-jefferson
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  testes-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependencias
        run: npm install

      - name: Executar testes de API
        run: npx playwright test --project=api

      - name: Salvar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: playwright-report/
          if-no-files-found: ignore
